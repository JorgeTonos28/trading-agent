schema_version: 1
updated_on: 2026-10-01
project:
  name: Trading OS
  purpose: auditable_agentic_quantitative_trading_platform
  authoritative_roadmap: docs/master/hoja_de_ruta_sistema_trading_agentes_ia_v0.2.md
  role_now: Plan Architect
  role_after_freeze: Plan Guardian
version_control:
  remote: https://github.com/JorgeTonos28/trading-agent
  stable_default_branch: main
  stable_baseline_commit: a28d6f3
  working_branch: plan-architect
  promotion_policy: reviewed_approved_milestones_only
  commit_policy: milestone_based_descriptive_commits
  allowed_commit_prefixes: [planning, research, decision, docs]
stage:
  current: PREPARATION_AND_PLAN_HARDENING
  implementation_locked: true
  ready_for_implementation: false
  plan_version: draft_v0.2
  next_target: MASTER_PLAN_v1.0.md
objective:
  preparation: Evidence-backed, internally consistent, approved implementation contract
  product: Agentic Trading OS that researches, ingests diverse sources, develops and evaluates strategies, signals, controls risk, executes, monitors, measures, learns by Champion/Challenger and teaches the owner
  first_operating_mode: PAPER
constraints:
  no_production_implementation_before_ready: true
  no_real_money_before_live_gates_and_human_approval: true
  llm_direct_broker_order_authority: false
  deterministic_risk_gateway: true
  per_trade_human_approval_for_approved_strategy: false
  research_cannot_promote_or_modify_champion: true
  point_in_time_research: true
  auditable_and_versioned_decisions: true
  no_leverage_short_options_futures_crypto_in_v1: true
  strategy_agent_to_trade_intent_to_risk_to_execution_to_broker: true
baseline_decisions:
  - id: D-001
    result: Preparation Program and formal Definition of Ready precede implementation
  - id: D-002
    result: Strategy/Agent -> TradeIntent -> deterministic Risk Engine -> Execution Engine -> Broker
  - id: D-003
    result: First operating version is paper trading; live needs separate gates and human approval
  - id: D-004
    result: Approved strategies may trade without per-order human approval inside fixed limits
  - id: D-005
    result: Research and production separated through Champion/Challenger and human promotion
  - id: D-007
    result: Trading OS Plugin is an intended capability layer; final runtime and contents remain open
  - id: ADR-000
    result: Strategy V1 selection is OPEN; MATR_V1 remains a candidate and benchmark, not the selected Champion
  - id: ADR-001
    result: A+ approved for PAPER V1; one deterministic operational Champion with multiple possible signal families, plus isolated Shadow Portfolio Manager and factual pedagogy
