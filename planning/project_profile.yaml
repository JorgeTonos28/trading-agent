    - autonomous_execution_boundaries
    - live_trading
    - leverage_short_selling_derivatives
    - material_security_architecture
    - major_scope_changes
    - promotion_of_shadow_portfolio_manager_to_operational_authority
  closure_rule: No P0/P1 open, every Definition of Ready gate evidenced, independent critical review, owner approval and plan freeze
  source_of_truth: planning/ registers plus approved master plan and ADRs
  creator_performance_claims: Record as unverified when applicable; no dedicated audit unless necessary for a project decision
