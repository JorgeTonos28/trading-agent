baseline_decisions:
  - id: D-001
    result: Preparation Program and formal Definition of Ready precede implementation
  - id: D-002
    result: Strategy/Agent -> TradeIntent -> deterministic Risk Engine -> Execution Engine -> Broker
  - id: D-003
    result: First operating version is paper trading; live needs separate gates and human approval
  - id: D-004
    result: Approved strategies may trade without per-order human approval inside fixed limits
  - id: D-005
    result: Research and production separated through Champion/Challenger and human promotion
  - id: D-007
    result: Trading OS Plugin is an intended capability layer; final runtime and contents remain open
  - id: ADR-000
    result: Strategy V1 selection is OPEN; MATR_V1 remains a candidate and benchmark, not the selected Champion
  - id: ADR-001
    result: A+ approved for PAPER V1; one deterministic operational Champion with multiple possible signal families, plus isolated Shadow Portfolio Manager and factual pedagogy
  - id: ADR-002
    result: G1+G2 PAPER V1 incident boundary; block new entries and reconcile, cancel only verified pending entries, preserve protection, require human resume after material pause; G3 not authorized
  - id: ADR-003
    result: Broker-independent internal order identity, durable command before send, event ledger and reconciliation; UNKNOWN never permits blind resend; G2 cancellation has separate deterministic risk authorization
  - id: ADR-004
    result: Point-in-time observations carry distinct clocks, channel-specific availability evidence and eligible_from; replay uses as-of revisions and snapshots, with raw tradable price separate from as-of adjusted views
  - id: ADR-005
    result: External data families begin as research only; promotion to operational Champion input requires semantic, PIT, quality, license, OOS, risk and human-governance gates; no family or provider selected
  - id: ADR-006
    result: PAPER V1 deterministic risk uses the most restrictive applicable independent exposure/cash, estimated protection, gap/slippage, liquidity and concurrent-reservation constraints; no numerical policy approved
  - id: ADR-007
    result: R-006 agentic layer limited to OpenAI and Anthropic; Plus target and public assets preferred for PAPER under superseding ADR-013; Team research only; LIVE unknown; paid execution requires ADR-008 approval
  - id: ADR-009
    result: Candidate cohort approved for acceptance only; reproducible environment bootstrap and reusable role packages required before D-024 and DoR
  - id: ADR-010
    result: Historical environment assignment superseded by ADR-013; approved_versioned_release_tag_for_deployment and no_main_promotion remain
  - id: ADR-011
    result: Option_A_candidate_PAPER_direction_and_RC2_reuse_dispositions_approved_automatic_event_schedule_jobs_no_financial_authority_no_final_freeze
  - id: ADR-013
    result: Team_INFOTEP_research; Plus_personal_Windows_target_PAPER; LIVE_UNKNOWN; design_separate_from_target_acceptance; S2B_lab_deferred_to_target
  - id: ADR-008
    result: PAPER zero_or_low_incremental_cost_first; LIVE economic_value_first; paid services research allowed, explicit approval before spend; free_or_included_or_self_created methodology acquisition only
