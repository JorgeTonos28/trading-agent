governance:
  decision_states: [OPEN, RESEARCHING, READY_FOR_DECISION, DECIDED, DEFERRED, SUPERSEDED]
  priority_meanings:
    P0: blocks_architecture
    P1: blocks_implementation
    P2: required_before_autonomous_paper
    P3: required_before_live
    P4: future_or_optional
  owner: Human project owner; identity and approval workflow to be confirmed
  human_approval_required_for:
    - final_production_strategy_architecture
    - broker_selection
    - materially_costly_live_data_provider
